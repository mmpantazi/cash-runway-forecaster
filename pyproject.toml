[project]
name = "cash-runway-forecaster"
version = "0.1.0"
description = "13-week cash forecast from each client's real payment habits"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
runway = "runway.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["runway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
